appId: br.manus.mundoquimera.capitulo1
productName: Mundo Quimera Capitulo 1
artifactName: Mundo-Quimera-Capitulo-1-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: electron/resources
files:
  - dist/public/**/*
  - electron/main.mjs
  - electron/loading.html
asar: true
compression: maximum
publish: null
mac:
  category: public.app-category.games
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - portable
  artifactName: Mundo-Quimera-Capitulo-1-setup-${version}-${arch}.${ext}
  publish: null
portable:
  artifactName: Mundo-Quimera-Capitulo-1-portable-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  maintainer: contato@mundoquimera.local
  category: Game
  target:
    - AppImage
    - deb
  synopsis: Jogo narrativo de exploração em Quimera
  description: Mundo Quimera — Capítulo 1, uma aventura narrativa de exploração e investigação.
