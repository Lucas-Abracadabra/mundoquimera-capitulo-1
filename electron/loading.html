<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mundo Quimera</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: #0d3544; color: #f5e8c9; font-family: Georgia, serif; }
    main { width: min(560px, 82vw); padding: 42px 34px; text-align: center; border: 3px solid #c99d46; background: linear-gradient(145deg, #1b5060, #0d3544); box-shadow: 8px 8px 0 rgba(20, 18, 12, .7); }
    .mark { width: 64px; height: 64px; margin: 0 auto 20px; display: grid; place-items: center; border: 2px solid #ddbb67; color: #ddbb67; font-size: 32px; transform: rotate(45deg); }
    .mark span { transform: rotate(-45deg); }
    p { margin: 0; letter-spacing: .16em; text-transform: uppercase; font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: #ddbb67; }
    h1 { margin: 14px 0 22px; font-size: clamp(28px, 5vw, 44px); font-weight: 600; }
    .line { height: 4px; overflow: hidden; background: rgba(245, 232, 201, .18); }
    .line i { display: block; width: 42%; height: 100%; background: #ddbb67; animation: drift 1.4s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(138%); } }
  </style>
</head>
<body><main><div class="mark"><span>✦</span></div><p>Atlas Fantástico de Quimera</p><h1>Abrindo o mapa...</h1><div class="line" aria-label="Carregando"><i></i></div></main></body>
</html>
